<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ecobank logo</title>
  <desc id="desc">Ecobank The Pan African Bank wordmark logo.</desc>
  <rect width="1200" height="400" fill="#f0f0f0"/>

  <!-- top arc accent -->
  <path d="M 760 95 C 820 52, 915 52, 980 103" fill="none" stroke="#0d5f7a" stroke-width="8" stroke-linecap="round"/>

  <!-- main wordmark -->
  <text x="118" y="230"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="205"
        font-weight="400"
        fill="#0d5f7a"
        letter-spacing="-9">Ecobank</text>

  <!-- underline -->
  <rect x="275" y="265" width="630" height="8" fill="#dfe66a" rx="4"/>

  <!-- tagline -->
  <text x="290" y="340"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="72"
        font-style="italic"
        font-weight="300"
        fill="#0d5f7a"
        letter-spacing="-1">The Pan African Bank</text>
</svg>
