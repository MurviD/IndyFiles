  <rect width="1200" height="420" fill="#f3f3f3"/>

  <g transform="translate(0,8)">
    <path d="M130 155 C 210 95, 315 82, 460 102 C 580 118, 710 118, 820 96 C 960 68, 1038 98, 1088 122" fill="none" stroke="#0a607a" stroke-width="8" stroke-linecap="round"/>

